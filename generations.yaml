    description: "The Citroën Basalt (model code CC26) is a subcompact crossover SUV developed for emerging markets such as India and Brazil. Built on the Smart Car Platform (CMP - Common Modular Platform), it is related to the Citroën C3 (CC21) and Citroën C3 Aircross (CC24). The vehicle features a distinctive 5-door coupe SUV body style with a sloping roofline creating a fastback-like silhouette between a traditional sedan and an SUV. The exterior design incorporates Citroën's signature two-tier lighting arrangement and double-chevron logo integrated into the grille. The interior offers a modern design with a floating touchscreen infotainment system, digital instrument options, and practical storage solutions. Powertrain options include 1.0L naturally aspirated FireFly three-cylinder, 1.0L turbocharged FireFly three-cylinder (both flex-fuel for Brazil market), and 1.2L turbocharged EB2DT three-cylinder engines, paired with 5-speed manual, 6-speed manual, or 6-speed automatic transmissions depending on market. Production commenced in 2024 with launches in India (August 30, 2024), Brazil (October 2, 2024), and Indonesia (July 24, 2025). The vehicle is assembled in India (Tiruvallur) and Brazil (Porto Real) by Stellantis operations."
